<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempahan Bilik Khas SMK Pekan</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        .glass-light {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .glass-dark {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        .bar-animate { transition: width 1s ease-in-out; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0h_uJ9G4XKYUrTEyVHkA-jfmVmNCHJqvKk_2Iey9qPSIG8s7F-uD6jWBQR7jgQuk5ig/exec"; 
        
        const DEFAULT_ROOMS = [
            { name: "Makmal Komputer" }, { name: "Digital Hub" }, { name: "Pusat Sumber Al Ghazali" },
            { name: "Bilik Eksplorasi Sarjana" }, { name: "Anjung Suluh Budiman" }, { name: "Dewan Aspirasi Sh Mohmed Puzi" },
            { name: "Bilik Masakan SRT" }, { name: "Bilik Jahitan SRT" }, { name: "Bengkel MPV" },
            { name: "Bilik SAL" }, { name: "Bengkel RBT 1" }, { name: "Bengkel RBT 2" }, { name: "Bengkel RBT 3" }
        ];

        // Masa dilanjutkan sehingga jam 5:10 PM / 5:00 PM
        const TIME_SLOTS_NORMAL = ["07:40 AM", "08:10 AM", "08:40 AM", "09:10 AM", "09:40 AM", "10:10 AM", "10:40 AM", "11:10 AM", "11:40 AM", "12:10 PM", "12:40 PM", "01:10 PM", "01:40 PM", "02:10 PM", "02:40 PM", "03:10 PM", "03:40 PM", "04:10 PM", "04:40 PM", "05:10 PM"];
        const TIME_SLOTS_FRIDAY = ["07:30 AM", "08:00 AM", "08:30 AM", "09:00 AM", "09:30 AM", "10:00 AM", "10:30 AM", "11:00 AM", "11:30 AM", "12:00 PM", "02:30 PM", "03:00 PM", "03:30 PM", "04:00 PM", "04:30 PM", "05:00 PM"];
        const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        // --- FUNGSI BANTUAN ---
        const getSafeYYYYMMDD = (dateObj) => {
            const d = new Date(dateObj);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const getDayOfWeek = (dateStr) => {
            if (!dateStr) return -1;
            const parts = dateStr.split('-');
            if (parts.length !== 3) return -1;
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            return d.getDay(); 
        };
        
        // Sabtu dan Ahad akan menggunakan jadual Normal
        const getSlotsForDay = (dayIndex) => dayIndex === 5 ? TIME_SLOTS_FRIDAY : TIME_SLOTS_NORMAL;

        const getSlotRange = (start, end, availableSlots) => {
            const startIndex = availableSlots.indexOf(start.trim());
            const endIndex = availableSlots.indexOf(end.trim());
            if (startIndex === -1 || endIndex === -1 || startIndex > endIndex) return [start.trim()];
            return availableSlots.slice(startIndex, endIndex + 1);
        };

        // --- VIEW: DASHBOARD ---
        const DashboardView = ({ bookings, fixedSchedules, darkMode }) => {
            const [viewMode, setViewMode] = useState('daily'); 
            const [selectedDate, setSelectedDate] = useState(getSafeYYYYMMDD(new Date()));
            const [selectedRoom, setSelectedRoom] = useState(DEFAULT_ROOMS[0].name);
            const [currentMonthDate, setCurrentMonthDate] = useState(new Date());

            const targetDayOfWeek = getDayOfWeek(selectedDate);
            const availableSlotsToday = getSlotsForDay(targetDayOfWeek);
            const targetBookings = bookings.filter(b => b.date === selectedDate);
            const targetFixed = fixedSchedules.filter(f => parseInt(f.dayOfWeek) === targetDayOfWeek);

            // Pengiraan Bar % Harian
            const calculateDailyUsage = () => {
                if (availableSlotsToday.length === 0) return [];
                return DEFAULT_ROOMS.map(room => {
                    let usedSlotsCount = 0;
                    targetFixed.forEach(f => {
                        if (f.room === room.name) {
                            const times = f.timeSlot.split("-").map(t => t.trim());
                            usedSlotsCount += (times.length === 2 ? getSlotRange(times[0], times[1], availableSlotsToday) : [f.timeSlot.trim()]).length;
                        }
                    });
                    targetBookings.forEach(b => {
                        if (b.room === room.name) {
                            const times = b.timeSlot.split("-").map(t => t.trim());
                            usedSlotsCount += (times.length === 2 ? getSlotRange(times[0], times[1], availableSlotsToday) : [b.timeSlot.trim()]).length;
                        }
                    });
                    return { name: room.name, pct: Math.min((usedSlotsCount / availableSlotsToday.length) * 100, 100) };
                });
            };
            const dailyUsageData = calculateDailyUsage();

            const mYear = currentMonthDate.getFullYear();
            const mMonth = currentMonthDate.getMonth();
            const daysInMonth = new Date(mYear, mMonth + 1, 0).getDate();
            const firstDayOfMonth = new Date(mYear, mMonth, 1).getDay();
            const blanks = Array.from({ length: firstDayOfMonth }, (_, i) => i);
            const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);

            return (
                <div className="animate-fade-in space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <h2 className="text-2xl font-bold">Dashboard</h2>
                        <div className="flex bg-slate-200 dark:bg-slate-700 rounded-lg p-1 shadow-inner">
                            <button onClick={() => setViewMode('daily')} className={`px-4 py-2 text-sm font-medium rounded-md transition-all ${viewMode === 'daily' ? 'bg-white dark:bg-slate-800 shadow text-blue-600 dark:text-blue-400' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-600'}`}>Daily Usage Graph</button>
                            <button onClick={() => setViewMode('room_monthly')} className={`px-4 py-2 text-sm font-medium rounded-md transition-all ${viewMode === 'room_monthly' ? 'bg-white dark:bg-slate-800 shadow text-blue-600 dark:text-blue-400' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-600'}`}>Monthly Room Calendar</button>
                        </div>
                    </div>

                    {viewMode === 'daily' ? (
                        <div className={`p-6 md:p-8 rounded-2xl shadow-lg ${darkMode ? 'glass-dark' : 'glass-light'}`}>
                            <div className="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4 border-b pb-4 dark:border-slate-700">
                                <h3 className="font-bold text-xl">Daily Room Usage (%)</h3>
                                <div className="flex items-center bg-slate-100 dark:bg-slate-800 p-2 rounded-lg border dark:border-slate-700">
                                    <i className="fas fa-calendar-day text-blue-500 mr-3 ml-2"></i>
                                    <input type="date" value={selectedDate} onChange={e => setSelectedDate(e.target.value)} className="bg-transparent outline-none font-medium cursor-pointer" />
                                </div>
                            </div>
                            
                            {/* Graf Bar Penggunaan Harian */}
                            <div className="space-y-6 mb-10">
                                {dailyUsageData.map((data, idx) => (
                                    <div key={idx} className="relative w-full">
                                        <div className="flex justify-between text-sm font-semibold mb-2">
                                            <span className="flex items-center"><i className="fas fa-door-open mr-2 text-slate-400"></i>{data.name}</span>
                                            <span className={data.pct > 0 ? "text-blue-600 dark:text-blue-400" : "text-slate-400"}>{Math.round(data.pct)}%</span>
                                        </div>
                                        <div className="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-5 overflow-hidden flex shadow-inner">
                                            <div className={`h-full bar-animate rounded-full shadow-md ${data.pct > 75 ? 'bg-gradient-to-r from-red-500 to-red-400' : data.pct > 30 ? 'bg-gradient-to-r from-amber-500 to-amber-400' : 'bg-gradient-to-r from-green-500 to-emerald-400'}`} style={{ width: `${data.pct}%` }}></div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Jadual Terperinci Hari Ini */}
                            <div className="pt-6 border-t dark:border-slate-700">
                                <h3 className="font-bold text-lg mb-4 flex items-center"><i className="fas fa-list-ul text-blue-500 mr-2"></i> Today's Detailed Bookings</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm border-collapse rounded-lg overflow-hidden border dark:border-slate-700">
                                        <thead className={`${darkMode ? 'bg-slate-800' : 'bg-slate-100'}`}>
                                            <tr>
                                                <th className="p-3 font-semibold">Time Slot</th>
                                                <th className="p-3 font-semibold">Room</th>
                                                <th className="p-3 font-semibold">Booked By</th>
                                                <th className="p-3 font-semibold">Purpose</th>
                                                <th className="p-3 font-semibold">Type</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {targetFixed.length === 0 && targetBookings.length === 0 && (
                                                <tr><td colSpan="5" className="p-6 text-center text-slate-500 italic">No bookings found for this date.</td></tr>
                                            )}
                                            {targetFixed.map((f, i) => (
                                                <tr key={`f-${i}`} className={`border-b last:border-0 ${darkMode ? 'border-slate-700/50 hover:bg-slate-800/50' : 'border-slate-200 hover:bg-slate-50'}`}>
                                                    <td className="p-3 font-medium whitespace-nowrap">{f.timeSlot}</td>
                                                    <td className="p-3 font-bold">{f.room}</td>
                                                    <td className="p-3 text-slate-500">-</td>
                                                    <td className="p-3">{f.purpose}</td>
                                                    <td className="p-3"><span className="px-2 py-1 bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-200 rounded text-xs font-semibold"><i className="fas fa-lock mr-1"></i> Fixed</span></td>
                                                </tr>
                                            ))}
                                            {targetBookings.map((b, i) => (
                                                <tr key={`b-${i}`} className={`border-b last:border-0 ${darkMode ? 'border-slate-700/50 hover:bg-slate-800/50' : 'border-slate-200 hover:bg-slate-50'}`}>
                                                    <td className="p-3 font-medium whitespace-nowrap">{b.timeSlot}</td>
                                                    <td className="p-3 font-bold">{b.room}</td>
                                                    <td className="p-3">{b.teacherName}</td>
                                                    <td className="p-3">{b.purpose}</td>
                                                    <td className="p-3"><span className="px-2 py-1 bg-green-100 text-green-800 dark:bg-green-900/60 dark:text-green-200 rounded text-xs font-semibold"><i className="fas fa-check-circle mr-1"></i> Normal</span></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className={`p-6 rounded-2xl shadow-lg ${darkMode ? 'glass-dark' : 'glass-light'}`}>
                            <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b pb-4 dark:border-slate-700">
                                <select value={selectedRoom} onChange={e => setSelectedRoom(e.target.value)} className={`w-full md:w-72 p-3 font-bold rounded-lg border shadow-sm outline-none cursor-pointer ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-300'}`}>
                                    {DEFAULT_ROOMS.map(r => <option key={r.name} value={r.name}>{r.name}</option>)}
                                </select>
                                
                                <div className="flex items-center gap-4 bg-slate-100 dark:bg-slate-800 p-2 rounded-lg border dark:border-slate-700">
                                    <button onClick={() => setCurrentMonthDate(new Date(mYear, mMonth - 1, 1))} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-slate-700 rounded shadow-sm hover:bg-slate-200 transition-colors"><i className="fas fa-chevron-left text-sm"></i></button>
                                    <h3 className="text-lg font-bold w-40 text-center tracking-wide">{MONTHS[mMonth]} {mYear}</h3>
                                    <button onClick={() => setCurrentMonthDate(new Date(mYear, mMonth + 1, 1))} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-slate-700 rounded shadow-sm hover:bg-slate-200 transition-colors"><i className="fas fa-chevron-right text-sm"></i></button>
                                </div>
                            </div>
                            
                            <div className="grid grid-cols-7 gap-1 md:gap-2 text-center text-xs md:text-sm font-semibold mb-2">
                                <div className="text-red-500">Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div className="text-blue-500">Sat</div>
                            </div>
                            
                            <div className="grid grid-cols-7 gap-1 md:gap-2">
                                {blanks.map(b => <div key={`blank-${b}`} className="p-2 md:p-4 opacity-0"></div>)}
                                {days.map(day => {
                                    const dStr = getSafeYYYYMMDD(new Date(mYear, mMonth, day));
                                    const dDayOfWeek = getDayOfWeek(dStr);
                                    
                                    const dayBookings = bookings.filter(bk => bk.date === dStr && bk.room === selectedRoom);
                                    const fixedBookings = fixedSchedules.filter(f => parseInt(f.dayOfWeek) === dDayOfWeek && f.room === selectedRoom);
                                    
                                    const hasData = dayBookings.length > 0 || fixedBookings.length > 0;
                                    const isToday = dStr === getSafeYYYYMMDD(new Date());
                                    
                                    return (
                                        <div key={day} className={`border rounded-xl p-1.5 md:p-2 min-h-[110px] md:min-h-[140px] flex flex-col transition-all hover:shadow-md ${isToday ? 'ring-2 ring-blue-500' : ''} ${darkMode ? 'border-slate-700 bg-slate-800/60' : 'border-slate-200 bg-white'}`}>
                                            <span className={`text-xs md:text-sm font-bold mb-2 flex justify-center items-center w-6 h-6 rounded-full ${hasData ? 'bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300' : ''}`}>{day}</span>
                                            <div className="flex-1 overflow-y-auto space-y-1.5 pr-1 custom-scrollbar">
                                                {fixedBookings.map((f, i) => (
                                                    <div key={`f-${i}`} className="text-[10px] md:text-xs leading-tight bg-amber-100 text-amber-800 dark:bg-amber-900/70 dark:text-amber-200 rounded p-1.5 shadow-sm border border-amber-200 dark:border-amber-700/50">
                                                        <div className="font-semibold mb-0.5"><i className="fas fa-lock text-[8px] mr-1"></i>{f.timeSlot}</div>
                                                        <div className="truncate font-bold opacity-90">{f.purpose}</div>
                                                    </div>
                                                ))}
                                                {dayBookings.map((b, i) => (
                                                    <div key={`b-${i}`} className="text-[10px] md:text-xs leading-tight bg-green-100 text-green-800 dark:bg-green-900/70 dark:text-green-200 rounded p-1.5 shadow-sm border border-green-200 dark:border-green-700/50">
                                                        <div className="font-bold mb-0.5"><i className="fas fa-clock text-[8px] mr-1"></i>{b.timeSlot}</div>
                                                        <div className="truncate font-semibold"><i className="fas fa-user text-[8px] mr-1 text-slate-500"></i>{b.teacherName}</div>
                                                        <div className="truncate opacity-80 italic mt-0.5">{b.purpose}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- VIEW: NEW BOOKING ---
        const BookingForm = ({ bookings, fixedSchedules, handleAddBooking, loading, showNotification, darkMode }) => {
            const [formName, setFormName] = useState("");
            const [formDate, setFormDate] = useState("");
            const [formStart, setFormStart] = useState("");
            const [formEnd, setFormEnd] = useState("");
            const [formRoom, setFormRoom] = useState("");
            const [formPurpose, setFormPurpose] = useState("");

            const todayStr = getSafeYYYYMMDD(new Date());
            const dayOfWeek = getDayOfWeek(formDate);
            const availableSlots = getSlotsForDay(dayOfWeek);
            
            // Logik Anti-Collision (Lebih Kebal)
            const isSlotBooked = (slotToCheck, checkDate, checkRoom) => {
                if (!checkDate || !checkRoom) return false;
                const dWeek = getDayOfWeek(checkDate);
                const slotsForCheckDay = getSlotsForDay(dWeek);
                
                // Check Fixed
                const isFixed = fixedSchedules.some(f => {
                    if (parseInt(f.dayOfWeek) !== dWeek || f.room !== checkRoom) return false;
                    const times = f.timeSlot.split("-").map(s => s.trim());
                    return (times.length === 2) ? getSlotRange(times[0], times[1], slotsForCheckDay).includes(slotToCheck) : f.timeSlot.trim() === slotToCheck;
                });
                if(isFixed) return true;

                // Check Normal
                return bookings.some(b => {
                    if (b.date !== checkDate || b.room !== checkRoom) return false;
                    const times = b.timeSlot.split("-").map(s => s.trim());
                    return (times.length === 2) ? getSlotRange(times[0], times[1], slotsForCheckDay).includes(slotToCheck) : b.timeSlot.trim() === slotToCheck;
                });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formName || !formDate || !formStart || !formEnd || !formRoom || !formPurpose) {
                    showNotification("Please fill in all fields.", "error"); return;
                }

                const rangeToBook = getSlotRange(formStart, formEnd, availableSlots);
                const collision = rangeToBook.some(s => isSlotBooked(s, formDate, formRoom));
                
                if (collision) {
                    showNotification("Collision detected! Selected time slot is already taken.", "error"); return;
                }
                
                handleAddBooking({
                    teacherName: formName, purpose: formPurpose, date: formDate,
                    timeSlot: formStart === formEnd ? formStart : `${formStart} - ${formEnd}`,
                    room: formRoom
                }, () => {
                    setFormName(""); setFormPurpose(""); setFormStart(""); setFormEnd("");
                });
            };

            return (
                <div className="max-w-4xl mx-auto animate-fade-in">
                    <h2 className="text-2xl font-bold mb-6">New Booking</h2>
                    <div className={`p-6 md:p-8 rounded-2xl shadow-lg ${darkMode ? 'glass-dark' : 'glass-light'}`}>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label className="block text-sm font-semibold mb-2">Teacher's Name</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i className="fas fa-user"></i></div>
                                        <input type="text" value={formName} onChange={e => setFormName(e.target.value)} required placeholder="e.g. Cikgu Ali" className={`w-full pl-10 pr-3 py-3 rounded-xl border focus:ring-2 focus:ring-blue-500 outline-none transition-shadow ${darkMode ? 'bg-slate-800/50 border-slate-600' : 'bg-white border-slate-300 shadow-sm'}`} />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold mb-2">Special Room</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i className="fas fa-door-open"></i></div>
                                        <select value={formRoom} onChange={e => setFormRoom(e.target.value)} required className={`w-full pl-10 pr-3 py-3 rounded-xl border focus:ring-2 focus:ring-blue-500 outline-none appearance-none cursor-pointer ${darkMode ? 'bg-slate-800/50 border-slate-600' : 'bg-white border-slate-300 shadow-sm'}`}>
                                            <option value="" disabled>Select Room</option>
                                            {DEFAULT_ROOMS.map((r, i) => <option key={i} value={r.name}>{r.name}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold mb-2">Date (Include Weekends)</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i className="fas fa-calendar"></i></div>
                                        <input type="date" min={todayStr} value={formDate} onChange={e => { setFormDate(e.target.value); setFormStart(""); setFormEnd(""); }} required className={`w-full pl-10 pr-3 py-3 rounded-xl border focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer ${darkMode ? 'bg-slate-800/50 border-slate-600' : 'bg-white border-slate-300 shadow-sm'}`} />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold mb-2">Purpose / Subject</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i className="fas fa-book"></i></div>
                                        <input type="text" value={formPurpose} onChange={e => setFormPurpose(e.target.value)} required placeholder="e.g. Science Class 5A" className={`w-full pl-10 pr-3 py-3 rounded-xl border focus:ring-2 focus:ring-blue-500 outline-none transition-shadow ${darkMode ? 'bg-slate-800/50 border-slate-600' : 'bg-white border-slate-300 shadow-sm'}`} />
                                    </div>
                                </div>
                            </div>
                            
                            <div className={`grid grid-cols-1 md:grid-cols-2 gap-6 p-5 rounded-xl border mt-4 transition-all duration-300 ${!formDate || !formRoom ? 'bg-slate-100 border-slate-200 dark:bg-slate-800/40 dark:border-slate-700 opacity-70 grayscale-[30%]' : 'bg-blue-50 border-blue-100 dark:bg-slate-800/80 dark:border-slate-700'}`}>
                                <div>
                                    <label className="block text-sm font-semibold mb-2">Start Time {!formDate || !formRoom ? <span className="text-red-500 text-xs ml-2 font-normal">(Sila pilih Tarikh & Bilik)</span> : ""}</label>
                                    <select value={formStart} onChange={e => setFormStart(e.target.value)} required disabled={!formDate || !formRoom} className={`w-full p-3 rounded-xl border focus:ring-2 focus:ring-blue-500 outline-none ${!formDate || !formRoom ? 'cursor-not-allowed' : 'cursor-pointer'} ${darkMode ? 'bg-slate-900/50 border-slate-600' : 'bg-white border-slate-300 shadow-sm'}`}>
                                        <option value="" disabled>Select Start</option>
                                        {availableSlots.map((slot, i) => {
                                            const isBooked = isSlotBooked(slot, formDate, formRoom);
                                            return <option key={i} value={slot} disabled={isBooked} className={isBooked ? "text-slate-400 line-through bg-slate-100 dark:bg-slate-800" : "font-medium"}>{slot} {isBooked ? "(Booked)" : ""}</option>
                                        })}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold mb-2">End Time {!formDate || !formRoom ? <span className="text-red-500 text-xs ml-2 font-normal">(Sila pilih Tarikh & Bilik)</span> : ""}</label>
                                    <select value={formEnd} onChange={e => setFormEnd(e.target.value)} required disabled={!formDate || !formRoom} className={`w-full p-3 rounded-xl border focus:ring-2 focus:ring-blue-500 outline-none ${!formDate || !formRoom ? 'cursor-not-allowed' : 'cursor-pointer'} ${darkMode ? 'bg-slate-900/50 border-slate-600' : 'bg-white border-slate-300 shadow-sm'}`}>
                                        <option value="" disabled>Select End</option>
                                        {availableSlots.map((slot, i) => {
                                            if(formStart && availableSlots.indexOf(slot) < availableSlots.indexOf(formStart)) return <option key={i} disabled className="hidden">{slot}</option>;
                                            const isBooked = isSlotBooked(slot, formDate, formRoom);
                                            return <option key={i} value={slot} disabled={isBooked} className={isBooked ? "text-slate-400 line-through bg-slate-100 dark:bg-slate-800" : "font-medium"}>{slot} {isBooked ? "(Booked)" : ""}</option>
                                        })}
                                    </select>
                                </div>
                            </div>

                            <button type="submit" disabled={loading} className="w-full mt-8 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-4 px-4 rounded-xl shadow-lg hover:shadow-xl transition-all flex justify-center items-center text-lg transform hover:-translate-y-1">
                                {loading ? <i className="fas fa-spinner fa-spin"></i> : <><i className="fas fa-paper-plane mr-3"></i> Confirm Booking</>}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- VIEW: RECORDS & REPORT ---
        const ListView = ({ bookings, handleDeleteBooking, darkMode }) => {
            const [filterMonth, setFilterMonth] = useState("");
            const [filterRoom, setFilterRoom] = useState("");
            
            const hasFilter = filterMonth !== "" || filterRoom !== "";
            
            const filteredBookings = useMemo(() => {
                if (!hasFilter) return [];
                let list = [...bookings].sort((a, b) => new Date(b.date) - new Date(a.date));
                if (filterMonth) list = list.filter(b => b.date.startsWith(filterMonth));
                if (filterRoom) list = list.filter(b => b.room === filterRoom);
                return list;
            }, [bookings, filterMonth, filterRoom]);

            const downloadPDF = () => {
                const element = document.getElementById('report-table');
                if(!element) return;
                const opt = {
                    margin: 0.5,
                    filename: `Report_${filterRoom || 'AllRooms'}_${filterMonth || 'AllDates'}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' }
                };
                html2pdf().set(opt).from(element).save();
            };

            return (
                <div className="animate-fade-in">
                    <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-6 gap-4">
                        <h2 className="text-2xl font-bold">Records & Query Report</h2>
                        <div className="flex flex-wrap gap-3 w-full xl:w-auto bg-slate-200 dark:bg-slate-800 p-2 rounded-xl">
                            <input type="month" value={filterMonth} onChange={e => setFilterMonth(e.target.value)} className={`px-3 py-2 rounded-lg border outline-none ${darkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-300 shadow-sm'}`} title="Filter by Month" />
                            <select value={filterRoom} onChange={e => setFilterRoom(e.target.value)} className={`px-3 py-2 rounded-lg border outline-none ${darkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-300 shadow-sm'}`}>
                                <option value="">All Rooms</option>
                                {DEFAULT_ROOMS.map(r => <option key={r.name} value={r.name}>{r.name}</option>)}
                            </select>
                            <button onClick={() => { setFilterMonth(""); setFilterRoom(""); }} className="px-3 py-2 rounded-lg bg-slate-300 dark:bg-slate-700 hover:bg-slate-400 font-medium">Clear</button>
                            {hasFilter && (
                                <button onClick={downloadPDF} className="px-4 py-2 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 text-white font-bold rounded-lg shadow flex items-center"><i className="fas fa-file-pdf mr-2"></i> PDF</button>
                            )}
                        </div>
                    </div>

                    {!hasFilter ? (
                        <div className={`p-16 text-center rounded-2xl border-2 border-dashed ${darkMode ? 'border-slate-700 bg-slate-800/40' : 'border-slate-300 bg-white/60'}`}>
                            <i className="fas fa-filter text-5xl text-slate-400 mb-4 block"></i>
                            <h3 className="text-xl font-bold text-slate-600 dark:text-slate-300">Generate a Report</h3>
                            <p className="text-slate-500 mt-2">Please select a Month or a Room from the filter menu above to view records and download PDFs.</p>
                        </div>
                    ) : (
                        <div id="report-table" className={`rounded-2xl shadow-lg overflow-hidden ${darkMode ? 'glass-dark' : 'glass-light'}`}>
                            <div className="p-5 border-b dark:border-slate-700 flex justify-between items-center" data-html2canvas-ignore="true" style={{display: 'none'}}>
                                <h2 className="text-xl font-bold">Laporan Bilik Khas SMK Pekan</h2>
                                <p className="font-medium">{filterMonth || 'Semua Bulan'} | {filterRoom || 'Semua Bilik'}</p>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className={`${darkMode ? 'bg-slate-800/80' : 'bg-slate-100/80'} border-b ${darkMode ? 'border-slate-700' : 'border-slate-200'}`}>
                                            <th className="p-4 font-semibold text-sm">Date</th>
                                            <th className="p-4 font-semibold text-sm">Time</th>
                                            <th className="p-4 font-semibold text-sm">Room</th>
                                            <th className="p-4 font-semibold text-sm">Teacher</th>
                                            <th className="p-4 font-semibold text-sm">Purpose</th>
                                            <th className="p-4 font-semibold text-sm text-center" data-html2canvas-ignore>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredBookings.length === 0 ? (
                                            <tr><td colSpan="6" className="p-10 text-center text-slate-500 text-lg"><i className="fas fa-folder-open text-4xl mb-3 block"></i>No records found for this query.</td></tr>
                                        ) : (
                                            filteredBookings.map((b, i) => (
                                                <tr key={i} className={`border-b last:border-0 ${darkMode ? 'border-slate-700/50 hover:bg-slate-800/50' : 'border-slate-200 hover:bg-slate-50/50'} transition-colors`}>
                                                    <td className="p-4 text-sm whitespace-nowrap font-medium">{b.date}</td>
                                                    <td className="p-4 text-sm whitespace-nowrap"><span className="px-2.5 py-1 bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-200 rounded border border-blue-200 dark:border-blue-800 text-xs font-semibold shadow-sm">{b.timeSlot}</span></td>
                                                    <td className="p-4 text-sm font-bold text-slate-700 dark:text-slate-200">{b.room}</td>
                                                    <td className="p-4 text-sm">{b.teacherName}</td>
                                                    <td className="p-4 text-sm">{b.purpose}</td>
                                                    <td className="p-4 text-center" data-html2canvas-ignore>
                                                        <button onClick={() => handleDeleteBooking(b.id)} className="text-red-500 hover:bg-red-100 dark:hover:bg-red-900/40 p-2.5 rounded-full transition-colors shadow-sm" title="Delete"><i className="fas fa-trash-alt"></i></button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- VIEW: SETTINGS (ADMIN PANEL) ---
        const SettingsView = ({ fixedSchedules, handleAddFixed, handleDeleteFixed, darkMode, showNotification }) => {
            const [fDay, setFDay] = useState("1");
            const [fStart, setFStart] = useState("");
            const [fEnd, setFEnd] = useState("");
            const [fRoom, setFRoom] = useState("");
            const [fPurpose, setFPurpose] = useState("");

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!fStart || !fEnd || !fRoom || !fPurpose) { showNotification("Please complete the form", "error"); return; }
                const finalTimeSlot = fStart === fEnd ? fStart : `${fStart} - ${fEnd}`;
                handleAddFixed({ dayOfWeek: fDay, timeSlot: finalTimeSlot, room: fRoom, purpose: fPurpose });
                setFStart(""); setFEnd(""); setFRoom(""); setFPurpose("");
            };

            return (
                <div className="animate-fade-in">
                    <h2 className="text-2xl font-bold mb-6">Admin Panel</h2>
                    <div className={`p-6 md:p-8 rounded-2xl shadow-lg ${darkMode ? 'glass-dark' : 'glass-light'}`}>
                        <div className="flex items-center mb-6 border-b pb-4 dark:border-slate-700">
                            <i className="fas fa-lock text-amber-500 text-2xl mr-3"></i>
                            <h3 className="font-bold text-xl">Fixed Schedules (Jadual Tetap)</h3>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4 mb-8 bg-slate-100 dark:bg-slate-800/50 p-5 rounded-xl border dark:border-slate-700 items-end">
                            <div>
                                <label className="block text-xs font-semibold mb-1 uppercase tracking-wide">Day</label>
                                <select value={fDay} onChange={e => setFDay(e.target.value)} className={`w-full p-2.5 rounded-lg border text-sm font-medium outline-none ${darkMode ? 'bg-slate-900 border-slate-600' : 'bg-white border-slate-300'}`}>
                                    <option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option><option value="0">Sunday</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-semibold mb-1 uppercase tracking-wide">Start Time</label>
                                <select value={fStart} onChange={e => setFStart(e.target.value)} required className={`w-full p-2.5 rounded-lg border text-sm font-medium outline-none ${darkMode ? 'bg-slate-900 border-slate-600' : 'bg-white border-slate-300'}`}>
                                    <option value="">Select</option>
                                    {(fDay === "5" ? TIME_SLOTS_FRIDAY : TIME_SLOTS_NORMAL).map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-semibold mb-1 uppercase tracking-wide">End Time</label>
                                <select value={fEnd} onChange={e => setFEnd(e.target.value)} required className={`w-full p-2.5 rounded-lg border text-sm font-medium outline-none ${darkMode ? 'bg-slate-900 border-slate-600' : 'bg-white border-slate-300'}`}>
                                    <option value="">Select</option>
                                    {(fDay === "5" ? TIME_SLOTS_FRIDAY : TIME_SLOTS_NORMAL).map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>
                            <div className="lg:col-span-2">
                                <label className="block text-xs font-semibold mb-1 uppercase tracking-wide">Room</label>
                                <select value={fRoom} onChange={e => setFRoom(e.target.value)} required className={`w-full p-2.5 rounded-lg border text-sm font-medium outline-none ${darkMode ? 'bg-slate-900 border-slate-600' : 'bg-white border-slate-300'}`}>
                                    <option value="">Select Room</option>
                                    {DEFAULT_ROOMS.map(r => <option key={r.name} value={r.name}>{r.name}</option>)}
                                </select>
                            </div>
                            <div className="sm:col-span-2 lg:col-span-1">
                                <label className="block text-xs font-semibold mb-1 uppercase tracking-wide">Purpose/Class</label>
                                <div className="flex gap-2">
                                    <input type="text" value={fPurpose} onChange={e => setFPurpose(e.target.value)} required placeholder="e.g. 5A" className={`w-full p-2.5 rounded-lg border text-sm font-medium outline-none ${darkMode ? 'bg-slate-900 border-slate-600' : 'bg-white border-slate-300'}`} />
                                    <button type="submit" className="px-4 py-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-lg shadow-md hover:shadow-lg transition-all"><i className="fas fa-plus"></i></button>
                                </div>
                            </div>
                        </form>

                        <div className="overflow-x-auto rounded-xl border dark:border-slate-700">
                            <table className="w-full text-left text-sm border-collapse">
                                <thead>
                                    <tr className={`border-b ${darkMode ? 'bg-slate-800/80 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                                        <th className="p-3 font-bold">Day</th>
                                        <th className="p-3 font-bold">Time (Start - End)</th>
                                        <th className="p-3 font-bold">Room</th>
                                        <th className="p-3 font-bold">Purpose</th>
                                        <th className="p-3 font-bold text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {fixedSchedules.length === 0 ? <tr><td colSpan="5" className="p-8 text-center text-slate-500"><i className="fas fa-calendar-times text-3xl mb-2 block"></i>No fixed schedules found.</td></tr> : 
                                        fixedSchedules.map((f, i) => (
                                        <tr key={i} className={`border-b last:border-0 ${darkMode ? 'border-slate-700/50 hover:bg-slate-800/50' : 'border-slate-200 hover:bg-slate-50'}`}>
                                            <td className="p-3 font-medium">{DAYS[parseInt(f.dayOfWeek)]}</td>
                                            <td className="p-3"><span className="px-2 py-1 bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-200 rounded border border-amber-200 dark:border-amber-700 text-xs font-semibold">{f.timeSlot}</span></td>
                                            <td className="p-3 font-bold text-slate-700 dark:text-slate-200">{f.room}</td>
                                            <td className="p-3">{f.purpose}</td>
                                            <td className="p-3 text-center">
                                                <button onClick={() => handleDeleteFixed(f.id)} className="text-red-500 hover:bg-red-100 dark:hover:bg-red-900/40 p-2 rounded-full transition-colors"><i className="fas fa-trash-alt"></i></button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [darkMode, setDarkMode] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [bookings, setBookings] = useState([]);
            const [fixedSchedules, setFixedSchedules] = useState([]);
            const [loading, setLoading] = useState(true);
            const [notification, setNotification] = useState(null);

            useEffect(() => {
                const savedMode = localStorage.getItem('darkMode') === 'true';
                setDarkMode(savedMode);
                if (savedMode) document.documentElement.classList.add('dark');

                const localBookings = JSON.parse(localStorage.getItem('mockBookings') || '[]');
                const localFixed = JSON.parse(localStorage.getItem('mockFixed') || '[]');
                
                if (localBookings.length > 0 || localFixed.length > 0) {
                    setBookings(localBookings);
                    setFixedSchedules(localFixed);
                    setLoading(false);
                }
                
                fetchData();
                
                // Real-time Auto-Sync 10 seconds
                const syncInterval = setInterval(() => { if(SCRIPT_URL) fetchData(true) }, 10000); 
                return () => clearInterval(syncInterval);
            }, []);

            const fetchData = async (silent = false) => {
                if (!SCRIPT_URL) { if(!silent) setLoading(false); return; }
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);

                try {
                    const res = await fetch(SCRIPT_URL + `?t=${new Date().getTime()}`, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (res.ok) {
                        const data = await res.json();
                        
                        // Parse Date format properly
                        const processedBookings = (data.bookings || []).map(b => ({
                            ...b,
                            date: b.date && b.date.includes('T') ? getSafeYYYYMMDD(b.date) : b.date
                        }));
                        
                        setBookings(processedBookings);
                        setFixedSchedules(data.fixedSchedules || []);
                        
                        localStorage.setItem('mockBookings', JSON.stringify(processedBookings));
                        localStorage.setItem('mockFixed', JSON.stringify(data.fixedSchedules || []));
                    }
                } catch (error) {
                    if(!silent) console.warn("Sync failed. Using offline data.");
                } finally {
                    if(!silent) setLoading(false);
                }
            };

            const showNotification = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 4000);
            };

            const saveToAPI = async (payload) => {
                if (!SCRIPT_URL) return true;
                try {
                    const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                    return res.ok;
                } catch (error) { return false; }
            };

            const handleAddBooking = async (newBooking, onSuccess) => {
                setLoading(true);
                newBooking.id = new Date().getTime().toString();
                
                // Double Check Semasa Confirm
                await fetchData(true);
                const dWeek = getDayOfWeek(newBooking.date);
                const availableSlots = getSlotsForDay(dWeek);
                const times = newBooking.timeSlot.split("-").map(s=>s.trim());
                const rangeToBook = times.length === 2 ? getSlotRange(times[0], times[1], availableSlots) : [newBooking.timeSlot.trim()];
                
                const collision = rangeToBook.some(slot => bookings.some(b => {
                        if(b.date !== newBooking.date || b.room !== newBooking.room) return false;
                        const bTimes = b.timeSlot.split("-").map(s=>s.trim());
                        return (bTimes.length === 2) ? getSlotRange(bTimes[0], bTimes[1], availableSlots).includes(slot) : b.timeSlot.trim() === slot;
                    }));

                if (collision) {
                    showNotification("Slot masa baru sahaja diambil! Sila pilih masa lain.", "error");
                    setLoading(false);
                    return;
                }

                const success = await saveToAPI({ action: 'add', data: newBooking });
                if (success) {
                    const updated = [...bookings, newBooking];
                    setBookings(updated);
                    localStorage.setItem('mockBookings', JSON.stringify(updated));
                    showNotification("Booking successful!");
                    if(onSuccess) onSuccess();
                    setActiveTab('dashboard');
                } else {
                    showNotification("Failed to save booking.", "error");
                }
                setLoading(false);
            };

            const handleDeleteBooking = async (id) => {
                if(!confirm("Are you sure you want to delete this booking?")) return;
                setLoading(true);
                const success = await saveToAPI({ action: 'delete', id: id });
                if (success) {
                    const updated = bookings.filter(b => b.id !== id);
                    setBookings(updated);
                    localStorage.setItem('mockBookings', JSON.stringify(updated));
                    showNotification("Booking deleted.");
                }
                setLoading(false);
            };

            const handleAddFixed = async (newFixed) => {
                setLoading(true);
                newFixed.id = new Date().getTime().toString();
                const success = await saveToAPI({ action: 'addFixed', data: newFixed });
                if (success) {
                    const updated = [...fixedSchedules, newFixed];
                    setFixedSchedules(updated);
                    localStorage.setItem('mockFixed', JSON.stringify(updated));
                    showNotification("Fixed schedule added!");
                }
                setLoading(false);
            };

            const handleDeleteFixed = async (id) => {
                setLoading(true);
                const success = await saveToAPI({ action: 'deleteFixed', id: id });
                if (success) {
                    const updated = fixedSchedules.filter(f => f.id !== id);
                    setFixedSchedules(updated);
                    localStorage.setItem('mockFixed', JSON.stringify(updated));
                    showNotification("Fixed schedule deleted.");
                }
                setLoading(false);
            };

            return (
                <div className={`min-h-screen flex flex-col md:flex-row transition-colors duration-300 ${darkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-800'}`}>
                    
                    {notification && (
                        <div className={`fixed top-6 right-6 z-50 px-6 py-4 rounded-xl shadow-2xl flex items-center gap-4 animate-fade-in border ${notification.type === 'error' ? 'bg-red-50 border-red-200 text-red-700 dark:bg-red-900/90 dark:border-red-800 dark:text-red-100' : 'bg-emerald-50 border-emerald-200 text-emerald-700 dark:bg-emerald-900/90 dark:border-emerald-800 dark:text-emerald-100'}`}>
                            <i className={`fas ${notification.type === 'error' ? 'fa-times-circle' : 'fa-check-circle'} text-2xl`}></i>
                            <span className="font-bold text-base">{notification.msg}</span>
                        </div>
                    )}

                    {/* Sidebar Navigation */}
                    <div className={`w-full md:w-64 flex-shrink-0 flex flex-col z-30 transition-all ${darkMode ? 'bg-slate-900/95 border-slate-800' : 'bg-white/95 border-slate-200'} border-r backdrop-blur-xl md:sticky top-0 md:h-screen shadow-lg md:shadow-none`}>
                        <div className="p-6 flex items-center gap-4 border-b border-inherit">
                            <div className="w-14 h-14 flex-shrink-0 flex items-center justify-center rounded-xl bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 overflow-hidden shadow-sm">
                                <img src="logo.png" alt="Logo" className="w-full h-full object-contain p-1" onError={(e) => { e.target.outerHTML = '<i class="fas fa-school text-blue-600 text-2xl"></i>'; }} />
                            </div>
                            <div>
                                <h1 className="font-bold text-lg leading-tight tracking-tight">SMK Pekan</h1>
                                <p className="text-[11px] text-slate-500 dark:text-slate-400 font-bold tracking-wider uppercase mt-1">Booking System</p>
                            </div>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto py-6 px-4 space-y-2">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-semibold ${activeTab === 'dashboard' ? 'bg-gradient-to-r from-blue-600 to-blue-700 text-white shadow-md transform scale-[1.02]' : 'hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'}`}><i className="fas fa-chart-pie w-6 text-center"></i> Dashboard</button>
                            <button onClick={() => setActiveTab('new')} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-semibold ${activeTab === 'new' ? 'bg-gradient-to-r from-blue-600 to-blue-700 text-white shadow-md transform scale-[1.02]' : 'hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'}`}><i className="fas fa-calendar-plus w-6 text-center"></i> New Booking</button>
                            <button onClick={() => setActiveTab('list')} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-semibold ${activeTab === 'list' ? 'bg-gradient-to-r from-blue-600 to-blue-700 text-white shadow-md transform scale-[1.02]' : 'hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'}`}><i className="fas fa-print w-6 text-center"></i> Reports & Print</button>
                            <button onClick={() => setActiveTab('settings')} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-semibold ${activeTab === 'settings' ? 'bg-gradient-to-r from-blue-600 to-blue-700 text-white shadow-md transform scale-[1.02]' : 'hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'}`}><i className="fas fa-sliders-h w-6 text-center"></i> Admin Panel</button>
                        </div>
                        
                        <div className="p-5 border-t border-inherit space-y-4 bg-slate-50/50 dark:bg-slate-900/50">
                            <div className="flex items-center justify-between px-2">
                                <span className="text-sm font-semibold text-slate-600 dark:text-slate-300">Dark Mode</span>
                                <button onClick={() => { setDarkMode(!darkMode); localStorage.setItem('darkMode', !darkMode); if(!darkMode) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }} className={`w-12 h-6 rounded-full p-1 flex items-center transition-colors shadow-inner ${darkMode ? 'bg-blue-600 justify-end' : 'bg-slate-300 dark:bg-slate-600 justify-start'}`}><div className="w-4 h-4 rounded-full bg-white shadow-md transform transition-transform"></div></button>
                            </div>
                            <div className="flex items-center gap-2 px-2 text-xs font-bold text-slate-500">
                                <div className={`w-2.5 h-2.5 rounded-full shadow-sm ${SCRIPT_URL ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'}`}></div>
                                {SCRIPT_URL ? 'ONLINE (Auto-Sync)' : 'OFFLINE MODE'}
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col w-full overflow-hidden">
                        
                        {!SCRIPT_URL && (
                            <div className="w-full bg-red-600 text-white text-center py-2.5 px-4 text-sm font-bold shadow-md z-40 flex items-center justify-center gap-2">
                                <i className="fas fa-exclamation-triangle"></i> SCRIPT_URL is empty! App is currently Offline.
                            </div>
                        )}
                        
                        <div className="w-full bg-slate-200 dark:bg-slate-900 border-b border-slate-300 dark:border-slate-800 flex items-center justify-center overflow-hidden">
                             <img src="2.png" alt="School Banner" className="w-full h-auto object-contain object-center" onError={(e) => { e.target.style.display = 'none'; }} />
                        </div>

                        <div className="flex-1 p-4 md:p-8 overflow-y-auto relative">
                            {/* Loading Overlay */}
                            {loading && (
                                <div className="absolute inset-0 bg-slate-50/50 dark:bg-slate-900/50 backdrop-blur-sm z-20 flex items-center justify-center">
                                    <div className="bg-white dark:bg-slate-800 p-4 rounded-full shadow-lg text-blue-600 animate-spin">
                                        <i className="fas fa-circle-notch text-3xl"></i>
                                    </div>
                                </div>
                            )}
                            
                            <div style={{ display: activeTab === 'dashboard' ? 'block' : 'none' }}>
                                <DashboardView bookings={bookings} fixedSchedules={fixedSchedules} darkMode={darkMode} />
                            </div>
                            <div style={{ display: activeTab === 'new' ? 'block' : 'none' }}>
                                <BookingForm bookings={bookings} fixedSchedules={fixedSchedules} handleAddBooking={handleAddBooking} loading={loading} showNotification={showNotification} darkMode={darkMode} />
                            </div>
                            <div style={{ display: activeTab === 'list' ? 'block' : 'none' }}>
                                <ListView bookings={bookings} handleDeleteBooking={handleDeleteBooking} darkMode={darkMode} />
                            </div>
                            <div style={{ display: activeTab === 'settings' ? 'block' : 'none' }}>
                                <SettingsView fixedSchedules={fixedSchedules} handleAddFixed={handleAddFixed} handleDeleteFixed={handleDeleteFixed} darkMode={darkMode} showNotification={showNotification} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
