<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempahan Bilik Khas SMK Pekan</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        /* Dark Mode Colors */
        .bg-dark-base { background-color: #0f172a; } /* Slate 900 */
        .glass-dark { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .text-dark-primary { color: #f8fafc; }
        .text-dark-secondary { color: #94a3b8; }
        
        /* Light Mode Colors */
        .bg-light-base { background-color: #f0f9ff; } /* Sky 50 */
        .glass-light { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .text-light-primary { color: #0f172a; }
        .text-light-secondary { color: #475569; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        /* Loading Spinner */
        .loader { border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-light-base text-light-primary antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ==========================================
        // SILA MASUKKAN URL GOOGLE WEB APP ANDA DI SINI
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzL5n4xW5fVp6G__g-N2Yd12f6Y_019vG91N1A/exec";

        const NORMAL_TIME_SLOTS = [
            "07:40 AM", "08:10 AM", "08:40 AM", "09:10 AM", "09:40 AM", "10:10 AM", "10:40 AM", 
            "11:10 AM", "11:40 AM", "12:10 PM", "12:40 PM", "01:10 PM", "01:40 PM", "02:10 PM", "02:40 PM", "03:10 PM"
        ];
        const FRIDAY_TIME_SLOTS = [
            "07:30 AM", "08:00 AM", "08:30 AM", "09:00 AM", "09:30 AM", "10:00 AM", "10:30 AM", 
            "11:00 AM", "11:30 AM", "12:00 PM"
        ];

        const DEFAULT_ROOMS = [
            { name: "Makmal Komputer", image: "https://placehold.co/800x450/1e293b/ffffff?text=Makmal+Komputer" },
            { name: "Digital Hub", image: "https://placehold.co/800x450/1e293b/ffffff?text=Digital+Hub" },
            { name: "Pusat Sumber Al Ghazali", image: "https://placehold.co/800x450/1e293b/ffffff?text=Pusat+Sumber" },
            { name: "Bilik Eksplorasi Sarjana", image: "https://placehold.co/800x450/1e293b/ffffff?text=Bilik+Eksplorasi" },
            { name: "Anjung Suluh Budiman", image: "https://placehold.co/800x450/1e293b/ffffff?text=Anjung+Suluh" },
            { name: "Dewan Aspirasi Sh Mohmed Puzi", image: "https://placehold.co/800x450/1e293b/ffffff?text=Dewan+Aspirasi" },
            { name: "Bilik Masakan SRT", image: "https://placehold.co/800x450/1e293b/ffffff?text=Masakan+SRT" },
            { name: "Bilik Jahitan SRT", image: "https://placehold.co/800x450/1e293b/ffffff?text=Jahitan+SRT" },
            { name: "Bengkel MPV", image: "https://placehold.co/800x450/1e293b/ffffff?text=Bengkel+MPV" },
            { name: "Bilik SAL", image: "https://placehold.co/800x450/1e293b/ffffff?text=Bilik+SAL" },
            { name: "Bengkel RBT 1", image: "https://placehold.co/800x450/1e293b/ffffff?text=Bengkel+RBT+1" },
            { name: "Bengkel RBT 2", image: "https://placehold.co/800x450/1e293b/ffffff?text=Bengkel+RBT+2" },
            { name: "Bengkel RBT 3", image: "https://placehold.co/800x450/1e293b/ffffff?text=Bengkel+RBT+3" }
        ];

        // Fix for Google Sheets Date Offset Issue
        const getSafeYYYYMMDD = (dateString) => {
            if (!dateString) return "";
            const d = new Date(dateString);
            if (isNaN(d.getTime())) return dateString; // Return as is if invalid
            // Extract local components directly to avoid UTC shift
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const getDayOfWeek = (dateString) => {
            const date = new Date(dateString);
            return date.getDay(); // 0 = Sun, 1 = Mon, ..., 5 = Fri, 6 = Sat
        };

        const getSlotsForDay = (dayIndex) => {
            if (dayIndex === 5) return FRIDAY_TIME_SLOTS; // Friday
            if (dayIndex >= 1 && dayIndex <= 4) return NORMAL_TIME_SLOTS; // Mon-Thu
            return []; // Weekend
        };

        // Helper to generate array of slots between start and end (inclusive)
        const getSlotRange = (startTime, endTime, availableSlots) => {
            if (!startTime || !endTime) return [];
            const startIndex = availableSlots.indexOf(startTime);
            const endIndex = availableSlots.indexOf(endTime);
            if (startIndex === -1 || endIndex === -1 || startIndex > endIndex) return [];
            return availableSlots.slice(startIndex, endIndex + 1);
        };

        // Main Application Component
        const App = () => {
            const [darkMode, setDarkMode] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [bookings, setBookings] = useState([]);
            const [fixedSchedules, setFixedSchedules] = useState([]);
            const [settings, setSettings] = useState({});
            const [loading, setLoading] = useState(true);
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [toast, setToast] = useState(null);
            const [rooms, setRooms] = useState(DEFAULT_ROOMS);
            const [schoolLogo, setSchoolLogo] = useState("");
            const [schoolBanner, setSchoolBanner] = useState("2.jpg"); // Tetapan Banner Kekal

            useEffect(() => {
                // Initialize Dark Mode from LocalStorage
                const savedMode = localStorage.getItem('smkpekan_darkmode');
                if (savedMode === 'true') {
                    setDarkMode(true);
                    document.body.classList.add('dark');
                    document.body.classList.remove('bg-light-base', 'text-light-primary');
                    document.body.classList.add('bg-dark-base', 'text-dark-primary');
                }
            }, []);

            const toggleDarkMode = () => {
                const newMode = !darkMode;
                setDarkMode(newMode);
                localStorage.setItem('smkpekan_darkmode', newMode);
                if (newMode) {
                    document.body.classList.add('dark', 'bg-dark-base', 'text-dark-primary');
                    document.body.classList.remove('bg-light-base', 'text-light-primary');
                } else {
                    document.body.classList.remove('dark', 'bg-dark-base', 'text-dark-primary');
                    document.body.classList.add('bg-light-base', 'text-light-primary');
                }
            };

            useEffect(() => {
                const handleOnline = () => setIsOnline(true);
                const handleOffline = () => setIsOnline(false);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => { window.removeEventListener('online', handleOnline); window.removeEventListener('offline', handleOffline); };
            }, []);

            const applySettings = (fetchedSettings) => {
                // Update Logo & Banner
                if (fetchedSettings['schoolLogo']) setSchoolLogo(fetchedSettings['schoolLogo']);
                if (fetchedSettings['schoolBanner']) setSchoolBanner(fetchedSettings['schoolBanner']);
                
                // Update Room Images
                const updatedRooms = DEFAULT_ROOMS.map(room => {
                    const customImage = fetchedSettings[`room_${room.name}`];
                    return { ...room, image: customImage || room.image };
                });
                setRooms(updatedRooms);
            };

            const fetchBookings = async () => {
                // 1. Instant Cache Load
                const cachedBookings = localStorage.getItem('smkpekan_cache_bookings');
                const cachedFixed = localStorage.getItem('smkpekan_cache_fixed');
                const cachedSettings = localStorage.getItem('smkpekan_cache_settings');
                
                if (cachedBookings) {
                    setBookings(JSON.parse(cachedBookings));
                    setFixedSchedules(JSON.parse(cachedFixed || '[]'));
                    const parsedSettings = JSON.parse(cachedSettings || '{}');
                    setSettings(parsedSettings);
                    applySettings(parsedSettings);
                    setLoading(false);
                } else {
                    setLoading(true);
                }

                try {
                    let responseData = null;
                    if (SCRIPT_URL && SCRIPT_URL.includes("script.google")) {
                        // Cache buster to force fresh data
                        const cacheBusterUrl = SCRIPT_URL + (SCRIPT_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
                        
                        // Add a timeout of 8 seconds so it doesn't hang forever
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 8000);
                        
                        const response = await fetch(cacheBusterUrl, { signal: controller.signal });
                        clearTimeout(timeoutId);
                        
                        if (!response.ok) throw new Error("HTTP Error " + response.status);
                        responseData = await response.json();
                    } else {
                        throw new Error("Invalid or empty SCRIPT_URL");
                    }
                    
                    // Normalize dates 
                    const normalizedBookings = (responseData.bookings || []).map(b => ({
                        ...b,
                        date: getSafeYYYYMMDD(b.date)
                    }));
                    
                    // 2. Background Update
                    setBookings(normalizedBookings);
                    setFixedSchedules(responseData.fixedSchedules || []);
                    setSettings(responseData.settings || {});
                    applySettings(responseData.settings || {});

                    // 3. Save Fresh Data
                    localStorage.setItem('smkpekan_cache_bookings', JSON.stringify(normalizedBookings));
                    localStorage.setItem('smkpekan_cache_fixed', JSON.stringify(responseData.fixedSchedules || []));
                    localStorage.setItem('smkpekan_cache_settings', JSON.stringify(responseData.settings || {}));
                    
                } catch (error) {
                    console.warn("Peringatan Sistem: Beroperasi dalam Mock Mode. Sebab:", error.message);
                    
                    // Jika tiada cache langsung, sediakan persekitaran offline yang bersih
                    if (!cachedBookings) {
                        setBookings([]);
                        setFixedSchedules([]);
                        showToast('Offline Mode: Sistem beroperasi secara lokal.', 'success');
                    }
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { fetchBookings(); }, []);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const NavItem = ({ id, icon, label }) => (
                <button 
                    onClick={() => setActiveTab(id)}
                    className={`w-full text-left px-4 py-3 rounded-xl transition-all mb-2 flex items-center space-x-3 
                        ${activeTab === id 
                            ? (darkMode ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/50' : 'bg-blue-500 text-white shadow-md shadow-blue-500/30') 
                            : (darkMode ? 'hover:bg-slate-800 text-slate-300' : 'hover:bg-blue-50 text-slate-600')}`}
                >
                    <i className={`fas ${icon} w-5 text-center`}></i>
                    <span className="font-medium">{label}</span>
                </button>
            );

            // ==========================================
            // COMPONENT: DASHBOARD
            // ==========================================
            const DashboardView = () => {
                const todayStr = getSafeYYYYMMDD(new Date().toISOString());
                const todayDayOfWeek = getDayOfWeek(todayStr);
                const availableSlotsToday = getSlotsForDay(todayDayOfWeek);
                
                // Get today's bookings
                const todayBookings = bookings.filter(b => b.date === todayStr);
                
                // Get today's fixed schedules
                const todayFixed = fixedSchedules.filter(f => f.dayOfWeek == todayDayOfWeek);

                // Calculate Usage Percentage
                const calculateRoomUsage = (roomName) => {
                    if (availableSlotsToday.length === 0) return 0;
                    
                    let usedSlots = new Set();
                    
                    // Count fixed schedules
                    todayFixed.filter(f => f.room === roomName).forEach(f => {
                        usedSlots.add(f.timeSlot);
                    });

                    // Count ad-hoc bookings (handle Start - End time format)
                    todayBookings.filter(b => b.room === roomName).forEach(b => {
                        const times = b.timeSlot.split(" - ");
                        if (times.length === 2) {
                            const range = getSlotRange(times[0], times[1], availableSlotsToday);
                            range.forEach(slot => usedSlots.add(slot));
                        } else {
                            usedSlots.add(b.timeSlot);
                        }
                    });

                    const percentage = (usedSlots.size / availableSlotsToday.length) * 100;
                    return Math.min(Math.round(percentage), 100);
                };

                return (
                    <div className="animate-fade-in space-y-6">
                        <h2 className="text-2xl font-bold mb-4">Dashboard</h2>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                            {rooms.slice(0, 6).map((room, idx) => {
                                const usagePct = calculateRoomUsage(room.name);
                                return (
                                    <div key={idx} className={`rounded-2xl p-6 shadow-xl relative overflow-hidden transition-all hover:-translate-y-1 ${darkMode ? 'glass-dark' : 'glass-light'}`}>
                                        <div className="absolute inset-0 opacity-20 bg-cover bg-center object-contain" style={{backgroundImage: `url(${room.image})`, opacity: darkMode ? 0.2 : 0.1}}></div>
                                        <div className="relative z-10">
                                            <h3 className="font-bold text-lg mb-4">{room.name}</h3>
                                            
                                            <div className="space-y-2">
                                                <div className="flex justify-between text-sm font-semibold">
                                                    <span>Today's Usage</span>
                                                    <span>{usagePct}%</span>
                                                </div>
                                                <div className="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2.5">
                                                    <div className={`h-2.5 rounded-full ${usagePct > 80 ? 'bg-red-500' : usagePct > 40 ? 'bg-amber-500' : 'bg-green-500'}`} style={{width: `${usagePct}%`}}></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        <div className={`mt-8 rounded-2xl p-6 shadow-lg ${darkMode ? 'glass-dark' : 'glass-light'}`}>
                            <h3 className="font-bold text-xl mb-4">Today's Schedule ({new Date().toLocaleDateString('en-MY', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })})</h3>
                            
                            {availableSlotsToday.length === 0 ? (
                                <div className="text-center py-8 text-slate-500">
                                    <i className="fas fa-bed text-4xl mb-3"></i>
                                    <p>Weekend. No bookings available.</p>
                                </div>
                            ) : (
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm">
                                        <thead className={`text-xs uppercase border-b ${darkMode ? 'border-slate-700 text-slate-400' : 'border-slate-200 text-slate-600'}`}>
                                            <tr>
                                                <th className="px-4 py-3">Time</th>
                                                <th className="px-4 py-3">Room</th>
                                                <th className="px-4 py-3">Teacher</th>
                                                <th className="px-4 py-3">Purpose</th>
                                                <th className="px-4 py-3">Type</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {/* Combine Fixed and Normal Bookings for today */}
                                            {[...todayFixed.map(f => ({...f, isFixed: true})), ...todayBookings.map(b => ({...b, isFixed: false}))]
                                                .sort((a, b) => {
                                                    // Sort by time (using first time if it's a range)
                                                    const timeA = a.timeSlot.split(" - ")[0];
                                                    const timeB = b.timeSlot.split(" - ")[0];
                                                    return availableSlotsToday.indexOf(timeA) - availableSlotsToday.indexOf(timeB);
                                                })
                                                .map((item, idx) => (
                                                <tr key={idx} className={`border-b last:border-0 ${darkMode ? 'border-slate-800' : 'border-slate-100'}`}>
                                                    <td className="px-4 py-3 font-medium">{item.timeSlot}</td>
                                                    <td className="px-4 py-3">{item.room}</td>
                                                    <td className="px-4 py-3">
                                                        {item.isFixed ? <span className="text-slate-400 italic">Scheduled Class</span> : item.teacherName}
                                                    </td>
                                                    <td className="px-4 py-3">{item.purpose}</td>
                                                    <td className="px-4 py-3">
                                                        {item.isFixed 
                                                            ? <span className="px-2 py-1 bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400 text-xs rounded-lg font-semibold"><i className="fas fa-lock mr-1"></i>Fixed</span>
                                                            : <span className="px-2 py-1 bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 text-xs rounded-lg font-semibold">Booking</span>
                                                        }
                                                    </td>
                                                </tr>
                                            ))}
                                            {todayFixed.length === 0 && todayBookings.length === 0 && (
                                                <tr>
                                                    <td colSpan="5" className="px-4 py-8 text-center text-slate-500">
                                                        No bookings or classes scheduled for today.
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // ==========================================
            // COMPONENT: BOOKING FORM
            // ==========================================
            const BookingForm = () => {
                const [formDate, setFormDate] = useState("");
                const [formRoom, setFormRoom] = useState("");
                const [formStartTime, setFormStartTime] = useState("");
                const [formEndTime, setFormEndTime] = useState("");
                const [isSubmitting, setIsSubmitting] = useState(false);

                // Derived state
                const dayOfWeek = formDate ? getDayOfWeek(formDate) : null;
                const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                const availableSlots = formDate ? getSlotsForDay(dayOfWeek) : [];
                
                const selectedRoomObj = formRoom ? rooms.find(r => r.name === formRoom) : null;

                // Function to check if a specific time slot is booked
                const isSlotBooked = (slotToCheck) => {
                    if (!formDate || !formRoom) return false;
                    
                    // 1. Check Fixed Schedules
                    const isFixed = fixedSchedules.some(f => f.dayOfWeek === dayOfWeek && f.room === formRoom && f.timeSlot === slotToCheck);
                    if (isFixed) return true;

                    // 2. Check Ad-hoc Bookings
                    return bookings.some(b => {
                        if (b.date !== formDate || b.room !== formRoom) return false;
                        const times = b.timeSlot.split(" - ");
                        if (times.length === 2) {
                            // It's a range, check if slotToCheck falls within it
                            const range = getSlotRange(times[0], times[1], availableSlots);
                            return range.includes(slotToCheck);
                        }
                        return b.timeSlot === slotToCheck;
                    });
                };

                const handleSubmit = async (e) => {
                    e.preventDefault();
                    if (isWeekend) {
                        showToast("Cannot book on weekends.", "error"); return;
                    }
                    if (!formStartTime || !formEndTime) {
                        showToast("Please select Start and End time.", "error"); return;
                    }

                    const startIndex = availableSlots.indexOf(formStartTime);
                    const endIndex = availableSlots.indexOf(formEndTime);
                    if (startIndex > endIndex) {
                        showToast("End time must be after Start time.", "error"); return;
                    }

                    // Final Check for collisions in the selected range
                    const requestedRange = getSlotRange(formStartTime, formEndTime, availableSlots);
                    const hasCollision = requestedRange.some(slot => isSlotBooked(slot));
                    
                    if (hasCollision) {
                        showToast("Collision detected! One or more selected slots are already booked.", "error"); return;
                    }

                    setIsSubmitting(true);
                    
                    const newBooking = {
                        id: new Date().getTime().toString(),
                        teacherName: e.target.teacherName.value,
                        purpose: e.target.purpose.value,
                        date: formDate,
                        timeSlot: `${formStartTime} - ${formEndTime}`,
                        room: formRoom
                    };

                    try {
                        if (!SCRIPT_URL) throw new Error("No URL");
                        
                        const response = await fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'add', data: newBooking })
                        });
                        
                        const result = await response.json();
                        if (result.status === 'success') {
                            showToast("Booking successful!");
                            e.target.reset();
                            setFormDate(""); setFormRoom(""); setFormStartTime(""); setFormEndTime("");
                            fetchBookings(); // Refresh data
                        } else {
                            throw new Error(result.message);
                        }
                    } catch (error) {
                        // Mock fallback
                        const updatedBookings = [...bookings, newBooking];
                        setBookings(updatedBookings);
                        localStorage.setItem('smkpekan_cache_bookings', JSON.stringify(updatedBookings));
                        showToast("Saved locally (Mock Mode). Add SCRIPT_URL for cloud sync.", "success");
                        e.target.reset();
                        setFormDate(""); setFormRoom(""); setFormStartTime(""); setFormEndTime("");
                    } finally {
                        setIsSubmitting(false);
                    }
                };

                const today = new Date().toISOString().split("T")[0];

                return (
                    <div className="animate-fade-in max-w-4xl mx-auto">
                        <div className={`rounded-2xl shadow-xl overflow-hidden ${darkMode ? 'glass-dark' : 'glass-light'}`}>
                            
                            {/* Header / Room Image Preview */}
                            <div className="h-48 w-full bg-slate-200 dark:bg-slate-800 relative border-b border-slate-200 dark:border-slate-700 flex items-center justify-center">
                                {selectedRoomObj ? (
                                    <img 
                                        src={selectedRoomObj.image} 
                                        alt={selectedRoomObj.name} 
                                        className="w-full h-full object-contain"
                                        onError={(e) => { e.target.src = `https://placehold.co/800x450/1e293b/ffffff?text=${encodeURIComponent(selectedRoomObj.name)}` }}
                                    />
                                ) : (
                                    <div className="text-slate-400 text-center">
                                        <i className="fas fa-image text-4xl mb-2"></i>
                                        <p>Select a room to view image</p>
                                    </div>
                                )}
                            </div>

                            <div className="p-8">
                                <h2 className="text-2xl font-bold mb-6 flex items-center">
                                    <i className="fas fa-calendar-plus text-blue-500 mr-3"></i> 
                                    New Booking
                                </h2>
                                
                                <form onSubmit={handleSubmit} className="space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">Teacher Name</label>
                                            <input type="text" name="teacherName" required 
                                                className={`w-full p-3 rounded-xl border focus:ring-2 outline-none transition-all ${darkMode ? 'bg-slate-800 border-slate-700 focus:ring-blue-500' : 'bg-white border-slate-300 focus:ring-blue-400'}`}
                                                placeholder="e.g. Cikgu Ahmad" />
                                        </div>
                                        
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">Date</label>
                                            <input type="date" name="date" required min={today}
                                                value={formDate} onChange={(e) => setFormDate(e.target.value)}
                                                className={`w-full p-3 rounded-xl border focus:ring-2 outline-none transition-all ${darkMode ? 'bg-slate-800 border-slate-700 focus:ring-blue-500' : 'bg-white border-slate-300 focus:ring-blue-400'}`} />
                                            {isWeekend && <p className="text-red-500 text-xs mt-1"><i className="fas fa-exclamation-triangle"></i> Weekends are not allowed.</p>}
                                        </div>

                                        <div className="md:col-span-2">
                                            <label className="block text-sm font-semibold mb-2">Room</label>
                                            <select name="room" required
                                                value={formRoom} onChange={(e) => setFormRoom(e.target.value)}
                                                className={`w-full p-3 rounded-xl border focus:ring-2 outline-none transition-all ${darkMode ? 'bg-slate-800 border-slate-700 focus:ring-blue-500' : 'bg-white border-slate-300 focus:ring-blue-400'}`}>
                                                <option value="">-- Select Room --</option>
                                                {rooms.map((r, i) => <option key={i} value={r.name}>{r.name}</option>)}
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold mb-2">Start Time</label>
                                            <select required disabled={!formDate || isWeekend || !formRoom}
                                                value={formStartTime} onChange={(e) => {
                                                    setFormStartTime(e.target.value);
                                                    // Auto-adjust end time if it's before start time
                                                    if (formEndTime && availableSlots.indexOf(e.target.value) > availableSlots.indexOf(formEndTime)) {
                                                        setFormEndTime("");
                                                    }
                                                }}
                                                className={`w-full p-3 rounded-xl border focus:ring-2 outline-none transition-all ${darkMode ? 'bg-slate-800 border-slate-700 disabled:bg-slate-900' : 'bg-white border-slate-300 disabled:bg-slate-100'}`}>
                                                <option value="">-- Start Time --</option>
                                                {availableSlots.map((slot, i) => {
                                                    const booked = isSlotBooked(slot);
                                                    return (
                                                        <option key={i} value={slot} disabled={booked} className={booked ? "text-slate-400 line-through" : ""}>
                                                            {slot} {booked ? "(Booked)" : ""}
                                                        </option>
                                                    );
                                                })}
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold mb-2">End Time</label>
                                            <select required disabled={!formStartTime}
                                                value={formEndTime} onChange={(e) => setFormEndTime(e.target.value)}
                                                className={`w-full p-3 rounded-xl border focus:ring-2 outline-none transition-all ${darkMode ? 'bg-slate-800 border-slate-700 disabled:bg-slate-900' : 'bg-white border-slate-300 disabled:bg-slate-100'}`}>
                                                <option value="">-- End Time --</option>
                                                {availableSlots.map((slot, i) => {
                                                    const startIndex = availableSlots.indexOf(formStartTime);
                                                    const isBeforeStart = i < startIndex;
                                                    
                                                    // Also, we cannot select an end time if there's a booked slot BETWEEN start and this end time
                                                    let isBlockedByExisting = false;
                                                    if (startIndex !== -1 && i >= startIndex) {
                                                        const range = availableSlots.slice(startIndex, i + 1);
                                                        isBlockedByExisting = range.some(s => isSlotBooked(s));
                                                    }
                                                    
                                                    const isDisabled = isBeforeStart || isBlockedByExisting;

                                                    return (
                                                        <option key={i} value={slot} disabled={isDisabled} className={isDisabled ? "text-slate-400 line-through" : ""}>
                                                            {slot} {isBlockedByExisting ? "(Collision)" : ""}
                                                        </option>
                                                    );
                                                })}
                                            </select>
                                        </div>

                                        <div className="md:col-span-2">
                                            <label className="block text-sm font-semibold mb-2">Purpose / Subject</label>
                                            <input type="text" name="purpose" required 
                                                className={`w-full p-3 rounded-xl border focus:ring-2 outline-none transition-all ${darkMode ? 'bg-slate-800 border-slate-700 focus:ring-blue-500' : 'bg-white border-slate-300 focus:ring-blue-400'}`}
                                                placeholder="e.g. Science Class 5A" />
                                        </div>
                                    </div>
                                    
                                    <button type="submit" disabled={isSubmitting}
                                        className={`w-full py-4 rounded-xl font-bold text-white shadow-lg transition-all 
                                            ${isSubmitting ? 'bg-blue-400 cursor-not-allowed' : 'bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 hover:-translate-y-1'}`}>
                                        {isSubmitting ? <span className="flex items-center justify-center"><i className="fas fa-circle-notch fa-spin mr-2"></i> Submitting...</span> : 'Submit Booking'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                );
            };

            // ==========================================
            // COMPONENT: LIST & REPORTS
            // ==========================================
            const BookingList = () => {
                const [filterDate, setFilterDate] = useState("");
                
                const filteredBookings = filterDate ? bookings.filter(b => b.date === filterDate) : bookings;
                
                // Sort by date (descending) then time
                filteredBookings.sort((a, b) => {
                    if (a.date !== b.date) return new Date(b.date) - new Date(a.date);
                    return a.timeSlot.localeCompare(b.timeSlot);
                });

                const handleDelete = async (id) => {
                    if (!confirm("Are you sure you want to delete this booking?")) return;
                    
                    try {
                        if (!SCRIPT_URL) throw new Error("No URL");
                        const response = await fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'delete', id: id })
                        });
                        const result = await response.json();
                        if (result.status === 'success') {
                            showToast("Booking deleted");
                            fetchBookings();
                        }
                    } catch (error) {
                        const updatedBookings = bookings.filter(b => b.id !== id);
                        setBookings(updatedBookings);
                        localStorage.setItem('smkpekan_cache_bookings', JSON.stringify(updatedBookings));
                        showToast("Deleted locally (Mock Mode)", "success");
                    }
                };

                const exportPDF = () => {
                    const element = document.getElementById('print-area');
                    const opt = {
                        margin: 0.5,
                        filename: `Report_Bookings_${filterDate || 'All'}.pdf`,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2 },
                        jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
                    };
                    html2pdf().set(opt).from(element).save();
                };

                return (
                    <div className="animate-fade-in space-y-6">
                        <div className={`flex flex-col sm:flex-row justify-between items-start sm:items-center p-6 rounded-2xl shadow-lg ${darkMode ? 'glass-dark' : 'glass-light'}`}>
                            <h2 className="text-2xl font-bold mb-4 sm:mb-0">Records & Reports</h2>
                            
                            <div className="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-3 w-full sm:w-auto">
                                <input type="date" value={filterDate} onChange={(e) => setFilterDate(e.target.value)}
                                    className={`p-2 rounded-lg border outline-none ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-300'}`} />
                                
                                {filterDate && (
                                    <button onClick={() => setFilterDate("")} className="px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded-lg hover:opacity-80 transition">
                                        Clear
                                    </button>
                                )}
                                
                                <button onClick={exportPDF} className="px-4 py-2 bg-red-500 text-white rounded-lg shadow hover:bg-red-600 transition flex items-center justify-center">
                                    <i className="fas fa-file-pdf mr-2"></i> Export PDF
                                </button>
                            </div>
                        </div>

                        <div id="print-area" className={`rounded-2xl p-6 shadow-lg overflow-x-auto ${darkMode ? 'glass-dark' : 'glass-light'}`}>
                            <div className="mb-6 text-center print-only hidden">
                                <h2 className="text-2xl font-bold">Laporan Tempahan Bilik Khas SMK Pekan</h2>
                                <p>Tarikh Rekod: {filterDate ? filterDate : 'Keseluruhan'}</p>
                            </div>
                            
                            <table className="w-full text-left text-sm">
                                <thead className={`text-xs uppercase border-b ${darkMode ? 'border-slate-700 text-slate-400' : 'border-slate-200 text-slate-600'}`}>
                                    <tr>
                                        <th className="px-4 py-3">Date</th>
                                        <th className="px-4 py-3">Time</th>
                                        <th className="px-4 py-3">Room</th>
                                        <th className="px-4 py-3">Teacher</th>
                                        <th className="px-4 py-3">Purpose</th>
                                        <th className="px-4 py-3 html2pdf__page-break-avoid" data-html2canvas-ignore>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredBookings.length > 0 ? filteredBookings.map((b) => (
                                        <tr key={b.id} className={`border-b last:border-0 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition ${darkMode ? 'border-slate-800' : 'border-slate-100'}`}>
                                            <td className="px-4 py-3 font-medium whitespace-nowrap">{b.date}</td>
                                            <td className="px-4 py-3 whitespace-nowrap">{b.timeSlot}</td>
                                            <td className="px-4 py-3">{b.room}</td>
                                            <td className="px-4 py-3">{b.teacherName}</td>
                                            <td className="px-4 py-3">{b.purpose}</td>
                                            <td className="px-4 py-3" data-html2canvas-ignore>
                                                <button onClick={() => handleDelete(b.id)} className="text-red-500 hover:text-red-700 p-2 rounded-full hover:bg-red-50 dark:hover:bg-red-900/20 transition" title="Delete">
                                                    <i className="fas fa-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    )) : (
                                        <tr><td colSpan="6" className="text-center py-8 text-slate-500">No records found.</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                        <style dangerouslySetInnerHTML={{__html: `
                            @media print { 
                                .print-only { display: block !important; }
                                body { background: white; color: black; }
                                [data-html2canvas-ignore] { display: none !important; }
                            }
                        `}} />
                    </div>
                );
            };

            // ==========================================
            // COMPONENT: ADMIN PANEL (SETTINGS & FIXED SCHEDULES)
            // ==========================================
            const AdminPanel = () => {
                const [activeSubTab, setActiveSubTab] = useState('visuals');
                const [isSaving, setIsSaving] = useState(false);
                
                // Visual Settings State
                const [localSettings, setLocalSettings] = useState({ ...settings });
                
                const handleSettingChange = (key, value) => {
                    setLocalSettings(prev => ({ ...prev, [key]: value }));
                };

                const saveVisualSettings = async () => {
                    setIsSaving(true);
                    try {
                        if (!SCRIPT_URL) throw new Error("No URL");
                        const response = await fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'updateSettings', data: localSettings })
                        });
                        const result = await response.json();
                        if(result.status === 'success'){
                            showToast("Visual settings saved!");
                            fetchBookings();
                        }
                    } catch (error) {
                        setSettings(localSettings);
                        localStorage.setItem('smkpekan_cache_settings', JSON.stringify(localSettings));
                        applySettings(localSettings);
                        showToast("Saved locally (Mock Mode)", "success");
                    } finally {
                        setIsSaving(false);
                    }
                };

                // Fixed Schedule Form State
                const [fDay, setFDay] = useState("");
                const [fRoom, setFRoom] = useState("");
                const [fTime, setFTime] = useState("");
                const [fPurpose, setFPurpose] = useState("");

                const fAvailableSlots = fDay ? getSlotsForDay(parseInt(fDay)) : [];

                const addFixedSchedule = async (e) => {
                    e.preventDefault();
                    setIsSaving(true);
                    
                    const newFixed = {
                        id: new Date().getTime().toString(),
                        dayOfWeek: fDay,
                        timeSlot: fTime,
                        room: fRoom,
                        purpose: fPurpose
                    };

                    try {
                        if (!SCRIPT_URL) throw new Error("No URL");
                        const response = await fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'addFixed', data: newFixed })
                        });
                        const result = await response.json();
                        if(result.status === 'success'){
                            showToast("Fixed schedule added!");
                            fetchBookings();
                            setFDay(""); setFRoom(""); setFTime(""); setFPurpose("");
                        }
                    } catch (error) {
                        const updated = [...fixedSchedules, newFixed];
                        setFixedSchedules(updated);
                        localStorage.setItem('smkpekan_cache_fixed', JSON.stringify(updated));
                        showToast("Added locally (Mock Mode)", "success");
                        setFDay(""); setFRoom(""); setFTime(""); setFPurpose("");
                    } finally {
                        setIsSaving(false);
                    }
                };

                const deleteFixed = async (id) => {
                    if(!confirm("Delete this fixed schedule?")) return;
                    try {
                        if (!SCRIPT_URL) throw new Error("No URL");
                        const response = await fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'deleteFixed', id: id })
                        });
                        const result = await response.json();
                        if(result.status === 'success'){
                            showToast("Fixed schedule deleted");
                            fetchBookings();
                        }
                    } catch (error) {
                        const updated = fixedSchedules.filter(f => f.id !== id);
                        setFixedSchedules(updated);
                        localStorage.setItem('smkpekan_cache_fixed', JSON.stringify(updated));
                        showToast("Deleted locally", "success");
                    }
                };

                return (
                    <div className="animate-fade-in space-y-6">
                        <div className={`p-6 rounded-2xl shadow-lg ${darkMode ? 'glass-dark' : 'glass-light'}`}>
                            <h2 className="text-2xl font-bold mb-6"><i className="fas fa-cog text-slate-400 mr-2"></i> Admin Panel</h2>
                            
                            <div className="flex border-b border-slate-200 dark:border-slate-700 mb-6">
                                <button onClick={() => setActiveSubTab('visuals')} 
                                    className={`px-4 py-2 font-medium border-b-2 transition ${activeSubTab === 'visuals' ? 'border-blue-500 text-blue-500' : 'border-transparent text-slate-500 hover:text-slate-700'}`}>
                                    Visuals & Images
                                </button>
                                <button onClick={() => setActiveSubTab('fixed')} 
                                    className={`px-4 py-2 font-medium border-b-2 transition ${activeSubTab === 'fixed' ? 'border-blue-500 text-blue-500' : 'border-transparent text-slate-500 hover:text-slate-700'}`}>
                                    Fixed Schedules (Jadual Tetap)
                                </button>
                            </div>

                            {/* SubTab: Visuals */}
                            {activeSubTab === 'visuals' && (
                                <div className="space-y-6">
                                    <div className="p-4 bg-blue-50 dark:bg-blue-900/20 text-blue-800 dark:text-blue-300 rounded-lg text-sm">
                                        <i className="fas fa-info-circle mr-2"></i> Paste direct image URLs (e.g. ending in .jpg, .png). Avoid standard Google Drive viewer links. Use PostImages.org for easy hosting.
                                    </div>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">School Logo URL</label>
                                            <input type="text" value={localSettings['schoolLogo'] || ''} onChange={(e) => handleSettingChange('schoolLogo', e.target.value)}
                                                className={`w-full p-3 rounded-xl border outline-none ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-300'}`} placeholder="https://..." />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">School Banner URL</label>
                                            <input type="text" value={localSettings['schoolBanner'] || ''} onChange={(e) => handleSettingChange('schoolBanner', e.target.value)}
                                                className={`w-full p-3 rounded-xl border outline-none ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-300'}`} placeholder="e.g. 2.jpg or https://..." />
                                        </div>
                                    </div>

                                    <h3 className="font-bold text-lg pt-4 border-t border-slate-200 dark:border-slate-700">Room Images</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {DEFAULT_ROOMS.map((room, idx) => (
                                            <div key={idx}>
                                                <label className="block text-xs font-semibold mb-1">{room.name}</label>
                                                <input type="text" value={localSettings[`room_${room.name}`] || ''} onChange={(e) => handleSettingChange(`room_${room.name}`, e.target.value)}
                                                    className={`w-full p-2 rounded-lg border outline-none text-sm ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-300'}`} placeholder="https://..." />
                                            </div>
                                        ))}
                                    </div>

                                    <button onClick={saveVisualSettings} disabled={isSaving}
                                        className="mt-6 px-6 py-3 bg-blue-600 text-white rounded-xl font-bold shadow hover:bg-blue-700 transition">
                                        {isSaving ? 'Saving...' : 'Save Visual Settings'}
                                    </button>
                                </div>
                            )}

                            {/* SubTab: Fixed Schedules */}
                            {activeSubTab === 'fixed' && (
                                <div className="space-y-8">
                                    <form onSubmit={addFixedSchedule} className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 p-4 border border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-800/50">
                                        <div>
                                            <label className="block text-xs font-semibold mb-1">Day</label>
                                            <select required value={fDay} onChange={(e) => {setFDay(e.target.value); setFTime("");}}
                                                className={`w-full p-2 rounded-lg border outline-none text-sm ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-300'}`}>
                                                <option value="">Select Day</option>
                                                <option value="1">Monday</option>
                                                <option value="2">Tuesday</option>
                                                <option value="3">Wednesday</option>
                                                <option value="4">Thursday</option>
                                                <option value="5">Friday</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold mb-1">Room</label>
                                            <select required value={fRoom} onChange={(e) => setFRoom(e.target.value)}
                                                className={`w-full p-2 rounded-lg border outline-none text-sm ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-300'}`}>
                                                <option value="">Select Room</option>
                                                {rooms.map((r, i) => <option key={i} value={r.name}>{r.name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold mb-1">Time Slot (Exact)</label>
                                            <select required value={fTime} onChange={(e) => setFTime(e.target.value)} disabled={!fDay}
                                                className={`w-full p-2 rounded-lg border outline-none text-sm ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-300'}`}>
                                                <option value="">Select Time</option>
                                                {fAvailableSlots.map((slot, i) => <option key={i} value={slot}>{slot}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold mb-1">Purpose / Class</label>
                                            <input required type="text" value={fPurpose} onChange={(e) => setFPurpose(e.target.value)}
                                                className={`w-full p-2 rounded-lg border outline-none text-sm ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-300'}`} placeholder="e.g. 5 Mawar" />
                                        </div>
                                        <div className="flex items-end">
                                            <button type="submit" disabled={isSaving} className="w-full p-2 bg-amber-500 text-white font-bold rounded-lg hover:bg-amber-600 transition">
                                                Add Fixed
                                            </button>
                                        </div>
                                    </form>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm">
                                            <thead className={`text-xs uppercase border-b ${darkMode ? 'border-slate-700 text-slate-400' : 'border-slate-200 text-slate-600'}`}>
                                                <tr>
                                                    <th className="px-4 py-2">Day</th>
                                                    <th className="px-4 py-2">Time</th>
                                                    <th className="px-4 py-2">Room</th>
                                                    <th className="px-4 py-2">Purpose</th>
                                                    <th className="px-4 py-2">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {fixedSchedules.map((f, i) => {
                                                    const days = ["", "Mon", "Tue", "Wed", "Thu", "Fri"];
                                                    return (
                                                        <tr key={i} className={`border-b last:border-0 ${darkMode ? 'border-slate-800' : 'border-slate-100'}`}>
                                                            <td className="px-4 py-2 font-bold">{days[f.dayOfWeek]}</td>
                                                            <td className="px-4 py-2">{f.timeSlot}</td>
                                                            <td className="px-4 py-2">{f.room}</td>
                                                            <td className="px-4 py-2">{f.purpose}</td>
                                                            <td className="px-4 py-2">
                                                                <button onClick={() => deleteFixed(f.id)} className="text-red-500 hover:text-red-700"><i className="fas fa-trash"></i></button>
                                                            </td>
                                                        </tr>
                                                    )
                                                })}
                                                {fixedSchedules.length === 0 && <tr><td colSpan="5" className="text-center py-4">No fixed schedules set.</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    
                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-xl font-semibold transform transition-all flex items-center
                            ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}`}>
                            <i className={`fas ${toast.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'} mr-2`}></i>
                            {toast.message}
                        </div>
                    )}

                    {/* Sidebar */}
                    <div className={`w-full md:w-72 flex-shrink-0 p-6 flex flex-col ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'} border-r`}>
                        <div className="flex items-center space-x-4 mb-8">
                            <div className="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xl overflow-hidden shadow-inner">
                                {schoolLogo ? <img src={schoolLogo} alt="Logo" className="w-full h-full object-cover" /> : "SP"}
                            </div>
                            <div>
                                <h1 className="font-bold text-lg leading-tight tracking-tight">SMK Pekan</h1>
                                <p className={`text-xs ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Room Booking System</p>
                            </div>
                        </div>

                        <nav className="flex-1">
                            <NavItem id="dashboard" icon="fa-chart-pie" label="Dashboard" />
                            <NavItem id="book" icon="fa-plus-circle" label="New Booking" />
                            <NavItem id="list" icon="fa-list" label="Records & PDF" />
                            <NavItem id="admin" icon="fa-cog" label="Admin Panel" />
                        </nav>

                        <div className="mt-8 pt-6 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                            <div className="flex items-center text-sm font-medium">
                                <div className={`w-3 h-3 rounded-full mr-2 ${isOnline ? 'bg-green-500' : 'bg-red-500'}`}></div>
                                {isOnline ? 'Online' : 'Offline'}
                            </div>
                            
                            <div className="flex space-x-2">
                                <button onClick={fetchBookings} className="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="Refresh Data">
                                    <i className={`fas fa-sync-alt ${loading ? 'fa-spin' : ''}`}></i>
                                </button>
                                <button onClick={toggleDarkMode} className="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="Toggle Theme">
                                    <i className={`fas ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-600'}`}></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col h-screen relative overflow-hidden">
                        
                        {/* --- FIXED BANNER AREA --- */}
                        <div className={`w-full flex-shrink-0 h-28 sm:h-36 md:h-48 lg:h-56 border-b ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-slate-100 border-slate-200'} flex items-center justify-center relative z-10 shadow-sm`}>
                            <img 
                                src={schoolBanner} 
                                alt="Banner SMK Pekan" 
                                className="w-full h-full object-cover object-top"
                                onError={(e) => { e.target.src = 'https://placehold.co/1200x300/1e293b/ffffff?text=School+Banner' }}
                            />
                        </div>

                        {/* --- SCROLLABLE CONTENT AREA --- */}
                        <div className="flex-1 overflow-y-auto p-6 md:p-10 relative">
                            {loading && !bookings.length && (
                                <div className="absolute inset-0 z-40 bg-white/50 dark:bg-slate-900/50 backdrop-blur-sm flex flex-col items-center justify-center">
                                    <div className="loader mb-4"></div>
                                    <p className="font-semibold text-blue-600 dark:text-blue-400 animate-pulse">Loading secure connection...</p>
                                </div>
                            )}
                            
                            <div className="max-w-6xl mx-auto pb-10">
                                {activeTab === 'dashboard' && <DashboardView />}
                                {activeTab === 'book' && <BookingForm />}
                                {activeTab === 'list' && <BookingList />}
                                {activeTab === 'admin' && <AdminPanel />}
                            </div>
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
